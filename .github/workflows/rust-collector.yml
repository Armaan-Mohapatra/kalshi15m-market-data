name: Rust collector isolated validation
on:
  push:
    branches: [collector/rust-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-build-test:
    name: Rust build and tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust/collector
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/collector
      - name: Build offline replay and bounded REST CLI
        run: cargo build --all-targets --verbose
      - name: Run deterministic unit and integration tests
        run: cargo test --all-targets -- --nocapture
      - name: Validate offline replay -> SQLite/Parquet
        shell: pwsh
        run: |
          $stage = Join-Path "${{ runner.temp }}" 'Kalshi15mRustStage'
          $input = Join-Path (Get-Location) 'fixtures/smoke.ndjson'
          cargo run -- --home "$stage" replay --input "$input"
          if ($LASTEXITCODE -ne 0) { throw 'Replay failed' }
          cargo run -- --home "$stage" audit
          if ($LASTEXITCODE -ne 0) { throw 'Audit failed' }
          $db = Join-Path $stage 'data/paper_ledger.sqlite3'
          if (-not (Test-Path -LiteralPath $db)) { throw 'Staging SQLite missing' }
          $parts = Get-ChildItem -LiteralPath (Join-Path $stage 'data/market_data') -Filter '*.parquet' -Recurse
          if (-not $parts) { throw 'No finalized Parquet generated' }
          Write-Output "Verified staging files: $($parts.Count) Parquet parts"
