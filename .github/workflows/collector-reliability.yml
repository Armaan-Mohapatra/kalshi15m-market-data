name: Collector reliability regression

on:
  push:
    branches: [collector/reliability-v2, diagnostics/python-capture-triage, fix/collector-writer-hotpath, experiment/queue-25000]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    name: Isolated tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Parse Windows PowerShell scripts without executing them
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failure: $($_.FullName)"
            }
          }
      - name: Check read-only Windows triage has no staging side effects
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'does-not-exist-capture-probe'
          if (Test-Path -LiteralPath $probeRoot) { throw 'Unexpected preexisting probe root' }
          $raw = & ./scripts/windows/diagnose-capture-readonly.ps1 -RuntimeHome $probeRoot -StatusPort 65534 -IntervalSeconds 0
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Diagnostic script exited abnormally' }
          $result = ($raw | Out-String) | ConvertFrom-Json
          if ($result.classification -ne 'UNKNOWN_STATUS_UNREACHABLE') {
            throw "Unexpected diagnostic classification: $($result.classification)"
          }
          if (Test-Path -LiteralPath $probeRoot) { throw 'Read-only triage created a runtime directory' }
          $superviseOut = Join-Path $env:RUNNER_TEMP 'checkonly-stdout.json'
          $superviseErr = Join-Path $env:RUNNER_TEMP 'checkonly-stderr.txt'
          $superviseScript = (Resolve-Path ./scripts/windows/supervise.ps1).Path
          $superviseProcess = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList @(
            '-NoProfile','-File',$superviseScript,'-CheckOnly','-RuntimeHome',$probeRoot,
            '-RuntimePort','65534'
          ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $superviseOut -RedirectStandardError $superviseErr
          if ($superviseProcess.ExitCode -ne 1) {
            throw "Expected fail-closed check-only exit=1, got $($superviseProcess.ExitCode)"
          }
          $supervise = Get-Content -LiteralPath $superviseOut -Raw | ConvertFrom-Json
          if ($supervise.healthy -or $supervise.can_start -eq $true) {
            throw 'Unreachable worker incorrectly marked healthy'
          }
          if (Test-Path -LiteralPath $probeRoot) {
            throw 'Supervisor CheckOnly created a runtime directory or log file'
          }
      - name: Run isolated regression suite
        env:
          PYTHONPATH: src
          KALSHI15M_HOME: ${{ runner.temp }}/Kalshi15mReliabilityTests
          KALSHI15M_STATUS_PORT: '9876'
        run: python -m unittest discover -s tests -v
      - name: Run 12k versus 25k bounded queue / archive-writer experiment
        env:
          PYTHONPATH: src
        run: python tools/queue_capacity_experiment_ci.py
      - name: Upload synthetic capacity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-capacity-${{ matrix.os }}
          path: queue_capacity_ci_results.json
          if-no-files-found: warn
