name: Collector reliability regression

on:
  push:
    branches: [collector/reliability-v2, diagnostics/python-capture-triage]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    name: Isolated tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Parse Windows PowerShell scripts without executing them
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failure: $($_.FullName)"
            }
          }
      - name: Check read-only Windows triage has no staging side effects
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP 'does-not-exist-capture-probe'
          if (Test-Path -LiteralPath $probeRoot) { throw 'Unexpected preexisting probe root' }
          $raw = & ./scripts/windows/diagnose-capture-readonly.ps1 -RuntimeHome $probeRoot -StatusPort 65534 -IntervalSeconds 0
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Diagnostic script exited abnormally' }
          $result = ($raw | Out-String) | ConvertFrom-Json
          if ($result.classification -ne 'UNKNOWN_STATUS_UNREACHABLE') {
            throw "Unexpected diagnostic classification: $($result.classification)"
          }
          if (Test-Path -LiteralPath $probeRoot) { throw 'Read-only triage created a runtime directory' }
          $superviseRaw = & pwsh -NoProfile -File ./scripts/windows/supervise.ps1 -CheckOnly -RuntimeHome $probeRoot -RuntimePort 65534
          $superviseExit = $LASTEXITCODE
          if ($superviseExit -ne 1) { throw "Expected fail-closed check-only exit=1, got $superviseExit" }
          $supervise = ($superviseRaw | Out-String) | ConvertFrom-Json
          if ($supervise.healthy -or $supervise.can_start -eq $true) {
            throw 'Unreachable worker incorrectly marked healthy'
          }
          if (Test-Path -LiteralPath $probeRoot) {
            throw 'Supervisor CheckOnly created a runtime directory or log file'
          }
      - name: Run isolated regression suite
        env:
          PYTHONPATH: src
          KALSHI15M_HOME: ${{ runner.temp }}/Kalshi15mReliabilityTests
          KALSHI15M_STATUS_PORT: '9876'
        run: python -m unittest discover -s tests -v
