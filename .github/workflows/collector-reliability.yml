name: Collector reliability regression

on:
  push:
    branches: [collector/reliability-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    name: Isolated tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Parse Windows PowerShell scripts without executing them
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failure: $($_.FullName)"
            }
          }
      - name: Run isolated regression suite
        env:
          PYTHONPATH: src
          KALSHI15M_HOME: ${{ runner.temp }}/Kalshi15mReliabilityTests
          KALSHI15M_STATUS_PORT: '9876'
        run: python -m unittest discover -s tests -v
