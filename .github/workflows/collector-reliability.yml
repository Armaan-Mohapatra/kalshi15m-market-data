name: Collector reliability regression

on:
  push:
    branches: [collector/reliability-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    name: Isolated tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run isolated regression suite
        env:
          PYTHONPATH: src
          KALSHI15M_HOME: ${{ runner.temp }}/Kalshi15mReliabilityTests
          KALSHI15M_STATUS_PORT: '9876'
        run: python -m unittest discover -s tests -v
